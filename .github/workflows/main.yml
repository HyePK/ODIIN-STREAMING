name: ODIIN Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Restore shell permissions
        run: chmod +x scripts/*.sh

      - name: Apply ODIIN playback source migration
        if: github.event_name != 'pull_request'
        run: |
          base64 -d .github/odiin-source-fixes.patch.gz.b64 | gunzip > /tmp/odiin-source-fixes.patch
          if git apply --check /tmp/odiin-source-fixes.patch; then
            git apply /tmp/odiin-source-fixes.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/odiin-app.tsx app/studio/studio-client.tsx app/globals.css
            git commit -m "Apply ODIIN fullscreen playback and lint fixes"
            git push origin HEAD:main
          else
            echo "ODIIN source migration is already applied or no longer required."
          fi

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Tests
        run: node --test tests/*.test.mjs
